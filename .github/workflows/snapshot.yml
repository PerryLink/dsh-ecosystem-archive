name: snapshot
on:
  schedule: [{ cron: '0 4 1 * *' }]
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node scripts/snapshot.mjs
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
      - run: |
          git config user.name "dsh-archive-bot"
          git config user.email "dsh-archive-bot@users.noreply.github.com"
          git add data
          git diff --quiet && exit 0
          git commit -m "chore: monthly ecosystem snapshot"
          git push
